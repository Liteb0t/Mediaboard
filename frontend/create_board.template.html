<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Create board - CONFIG_site_name</title>
		<meta name="description" content="Fuze Mediaboard is a fast, modern messageboard.">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta charset="utf-8">
		<link rel="icon" type="image/x-icon" href="CONFIG_favicon_url">
		<link rel="stylesheet" href=FILE_"static/styles.css">
	</head>
	<body>
		<!--Navbar can go here-->
		<main>
			<h2>Create board - CONFIG_site_name</h2>
			<form action="" method="POST" autocomplete="off">
				<div class="FormGrid">
				<label for="board_slug_input">Slug</label>
				<input id="board_slug_input" type="text" name="board_slug" maxlength="CONFIG_board_max_slug" required><span></span>
				<label for="board_title_input">Title</label>
				<input id="board_title_input" type="text" name="board_title" maxlength="CONFIG_board_max_title" required><span></span>
				</div>
				<input id="public_checkbox" type="checkbox">
				<label for="public_checkbox">Make public</label><br><br>
				<!--<div class="FullWidth">
				<label for="remain_logged_in">Remain logged in</label>
				<input id="remain_logged_in" type="checkbox" name="remain_logged_in">
				</div>-->
				<!--JSON is used instead of standard HTTP so this is not used
				<input type="submit">-->
				<input id="create_button" type="button" value="Create"  onclick="createAction()">
				<!--<a class="Button RightAligned" href=window.location.pathname>Return</a>-->
			</form>
			<div id="error_messages"></div>
		</main>
		<dialog id="status_dialog"><p id="status_dialog_body">Loading...</p></dialog>
		<dialog id="success_dialog" closedby="any">
			<h2>Success</h2>
			<p>Create new board '<i id="dialog_new_board_title"></i>'</p>
			<div class="ToolBar"><a class="Button" href="./">Boards</a><button onclick="success_dialog.close()">Close</button></div>
		</dialog>
	</body>
<script>

async function createAction() {
	try {
		const slug_input = board_slug_input.value;
		const title_input = board_title_input.value;
		status_dialog.showModal();
		const login_response = await fetch("./api/board", {
			method: "POST",
			body: JSON.stringify({
				board: {
					slug: slug_input,
					title: title_input
				},
				make_public: public_checkbox.checked
			})
		});
		if (!(login_response && login_response.ok)) {
			let header_error_message = login_response.headers.get("message");
			if (header_error_message == null)
				throw(`ERROR ${login_response.status}\n${login_response.statusText}`);
			else
				throw(header_error_message);
		}
		status_dialog.close();
		dialog_new_board_title = title_input;
		success_dialog.showModal();
	}
	catch (error) {
		status_dialog.close();
		const error_message = error;
		error_message ??= "An unknown error occured";
		error_messages.innerText = error_message;
	}
}
</script>
</html>
