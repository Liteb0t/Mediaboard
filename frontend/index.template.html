<!DOCTYPE html>
<html lang="en">
	<head>
		<title>CONFIG_site_name</title>
		<meta name="description" content="Fuze Mediaboard is an imageboard engine with advanced permissions.">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta charset="utf-8">
		<link rel="icon" type="image/x-icon" href="CONFIG_favicon_url">
		<link rel="stylesheet" href=FILE_"static/styles.css">
	</head>
	<body>
		<!--Navbar can go here-->
		<main>
			<div id="header_bar" class="ToolBar WithBorders">
				<div id="WebsiteName"><b>CONFIG_site_name</b></div>
				<button id="refresh_button" class="ToolBarButton" onclick="loading_dialog.showModal();getAllBoards().then(() => {loading_dialog.close();});">&#x2B6E; Refresh</button>
				<a id="manage_server_button" class="Button ToolBarButton" href="manage_server.html" style="display: none;">Manage server</a>
				<div class="FlexSeparator"></div>
				<div id="warning_outdated_browser" style="color: #D00">Warning: outdated browser</div>
				<!--
				<div id="connection_status_container">Websocket:&nbsp;<span id="connection_status">Not connected &#x1F634;</span></div>
				-->
				<a id="registration_link" class="Button ToolBarButton RightAligned" href="registration.html" style="display: none">Log-in or Register</a>
				<div id="logged_in_indicator" style="display: none" class="RightAligned">
					Logged in as&nbsp;<b id="logged_in_as_username">Someone</b>
				</div>
				<a id="change_password_link" class="Button ToolBarButton" href="change_password.html" style="display: none">Change password</a>
				<button id="logout_button" onclick="logoutAction()" class="ToolBarButton" style="display: none">Logout</button>
				<a id="header_bar_mediaboard_link" href="https://fuze.page/software/mediaboard/" style="display: none">Fuze Mediaboard CONFIG_mediaboard_version</a>
			</div>
			<h3 id="location_indicator">List of boards</h3>
			<div id="board_list_container"></div>
			<a id="create_board_button" href="create_board.html" style="display: none">Create board</a>
		</main>
		<dialog id="loading_dialog"><p>Loading. Please wait...</p></dialog>
		<dialog id="error_dialog" closedby="any">
			<h2>Error</h2>
			<p id="error_message">Something happened.</p>
			<div class="ToolBar"><button onclick="error_dialog.close()">&#x1F5D9; Close</button></div>
		</dialog>
		<noscript>
			<dialog open style="margin-top: 20vh"><h2>Error</h2><p>This page requires <b>Javascript</b> to function. Enable Javascript in browser settings.</p></dialog>
		</noscript>
	</body>
<style>
#header_bar {
	border-top: 1px solid #888;
	border-bottom: 1px solid #888;
	#warning_outdated_browser {
		display: none;
	}
}
</style>
<script>
"use strict";
loading_dialog.showModal();
// const localDate = new Date();
// const timezone_offset_seconds = localDate.getTimezoneOffset() * 60;
const flex_separator = document.createElement("div");
flex_separator.classList.add("FlexSeparator");
let state = {
	server_permissions: {}
};

// For embedding Mediaboard within a webpage using an <iframe>.
// Hides everything except messages.
const url_params = new URLSearchParams(location.search);
let url_params_display_as_embed;
if (url_params.get("display") === "embed") {
	header_bar.style["display"] = "none";
	location_indicator.style["display"] = "none";
	url_params_display_as_embed = true;
}
else url_params_display_as_embed = false;
if (CONFIG_show_watermarks && !url_params_display_as_embed) header_bar_mediaboard_link.style["display"] = "inherit";

window.onpopstate = function(event) {
	if (event.state) {
		state = event.state;
	}
	getAllBoards();
}

// The value in the name field is set to the name used in the most recent post, if any.
if (localStorage.getItem("logged_in") === "true") {
	displayClientAsLoggedIn();
}
else {
	registration_link.style["display"] = "inherit";
}

function displayClientAsLoggedIn() {
	let account_username = localStorage.getItem("account_username");
	logged_in_as_username.textContent = account_username;
	logout_button.style["display"] = "inherit";
	logged_in_indicator.style["display"] = "inherit";
	change_password_link.style["display"] = "inherit";
}

function displayClientAsLoggedOut() {
	logout_button.style["display"] = "none";
	logged_in_indicator.style["display"] = "none";
	registration_link.style["display"] = "inherit";
	change_password_link.style["display"] = "none";
	localStorage.removeItem("account_username");
	localStorage.setItem("logged_in", "false");
}

async function logoutAction() {
	displayClientAsLoggedOut();
	// manage_server_button.style["display"] = "none";
	// localStorage.removeItem("server_permissions");
	state.server_permissions = undefined;
	const fetch_response = await fetch("./registration/logout", {method: "POST"});
	if (fetch_response && fetch_response.ok) {
		getAllBoards();
		getClientInfo();
	}
	else {
		console.error("Couldn't log out for one reason or another");
	}
}

async function getAllBoards() {
	try {
		let response = await fetch("api/boards");
		console.log(response);
		if (response.ok) {
			await response.json().then(response_obj => {
				console.log(response_obj);
				showAllBoards(response_obj);
			});
		}
		else {
			const error_message = response.headers.get("message");
			error_message ??= "An unknown error occured when attempting to fetch boards.";
			throw error_message;
		}
	}
	catch (error) {
		console.error(error);
		error_message.textContent = error;
		error_dialog.showModal();
	}
}

function showAllBoards(response_json) {
	if (response_json["client_permissions"]["create_board"]) {
		create_board_button.style["display"] = "initial";
	}
	const fragment = new DocumentFragment();
	const table_element = document.createElement("table");
	const headers_element = document.createElement("tr");
	["slug", "title"].forEach((column_name) => {
		let header = document.createElement("th");
		header.textContent = column_name;
		headers_element.append(header);
	});
	table_element.append(headers_element);
	for (let board of response_json.boards) {
		console.log(board);
		const board_element = document.createElement("tr");
		["slug", "title"].forEach((column_name) => {
			let col = document.createElement("td");
			col.textContent = board[column_name];
			board_element.append(col);
		});
		board_element.append(flex_separator.cloneNode());
		let col = document.createElement("td");
		if (board.client_permissions.manage_permissions) {
			const manage_permissions_link = document.createElement("a");
			manage_permissions_link.href = `manage_permissions.html?location=/board/${board.slug}`;
			manage_permissions_link.textContent = "Manage permissions";
			col.append(manage_permissions_link, document.createTextNode(" :: "));
		}
		const board_link = document.createElement("a");
		board_link.href = `board.html?board=${board.slug}`;
		board_link.textContent = "Open";
		col.append(board_link);
		board_element.append(col);

		// const slug_element = document.createElement("td");
		// slug_element.textContent = board.slug;
		table_element.append(board_element);
	}
	fragment.appendChild(table_element);
	board_list_container.replaceChildren(fragment);
}

// websocket = connectToServer();
async function getClientInfo() {
	const response = await fetch("api/user/client");
	console.log(response);
	if (response.ok) {
		await response.json().then(response_json => {
			console.log(response_json);
			if (!response_json["has_cookie"] && localStorage.getItem("logged_in") === "true") {
				displayClientAsLoggedOut();
			}
			state.server_permissions = response_json["server_permissions"];
			window.history.replaceState(state, null, ""); // Initial state
			manage_server_button.style["display"] = response_json["server_permissions"]["manage_permissions"] === true ? "inherit" : "none";
			console.log(state);
			// if (!(state.selected_thread.id >= 0)) {
			// 	updateReplyContainer(state.selected_thread.id, state.server_permissions);
			// }
			// reply_container.style["display"] = response_json["server_permissions"]["create_thread"] === true ? "inherit" : "none";
		});
	}
}
getClientInfo(); // runs asynchronously
getAllBoards().then(() => {
	loading_dialog.close();
})
</script>
</html>
