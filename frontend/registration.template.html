<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Authentication - CONFIG_site_name</title>
		<meta name="description" content="Fuze Mediaboard is a fast, modern messageboard.">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta charset="utf-8">
		<link rel="icon" type="image/x-icon" href="CONFIG_favicon_url">
		<link rel="stylesheet" href=FILE_"static/styles.css">
	</head>
	<body>
		<!--Navbar can go here-->
		<main>
			<h2>Authentication - CONFIG_site_name</h2>
			<p id="invite_information" style="display: none">You have been invited to join this server.</p>
			<form action="" method="POST" autocomplete="account">
				<div class="FormGrid">
				<label for="account_username_input">Username</label>
				<input id="account_username_input" type="text" name="account_username" maxlength="CONFIG_account_max_username" required><span></span>
				<label for="account_password_input">Password</label>
				<input id="account_password_input" type="password" name="account_password" required>
				<input type="button" value="Show" id="toggle_password_visibility_button" class="RightAligned" onclick="togglePasswordVisibility()">
				</div>
				<input id="stay_logged_in_checkbox" type="checkbox" checked>
				<label for="stay_logged_in_checkbox">Stay logged in for 90 days</label><br><br>
				<!--<div class="FullWidth">
				<label for="remain_logged_in">Remain logged in</label>
				<input id="remain_logged_in" type="checkbox" name="remain_logged_in">
				</div>-->
				<!--JSON is used instead of standard HTTP so this is not used
				<input type="submit">-->
				<input id="login_button" type="button" value="Log in"  onclick="loginAction()">
				<input type="button" value="Register" onclick="registerAction()">
				<!--<a class="Button RightAligned" href=window.location.pathname>Return</a>-->
			</form>
			<div id="error_messages"></div>
		</main>
		<dialog id="status_dialog"><p id="status_dialog_body">Loading...</p></dialog>
		<dialog id="login_success_dialog" closedby="any">
			<h2>Success</h2>
			<p>Logged in as <i id="logged_in_as">some dude idk</i></p>
			<div class="ToolBar"><a class="Button" href="./">Proceed</a><button onclick="login_success_dialog.close()">Close</button></div>
		</dialog>
		<dialog id="registration_success_dialog" closedby="any">
			<h2>Success</h2>
			<p>Registered as <i id="registered_as">some dude idk</i>. You are now logged in.</p>
			<div class="ToolBar"><a class="Button" href="./">Proceed</a><button onclick="registration_success_dialog.close()">Close</button></div>
		</dialog>
	</body>
<style>
#invite_information {
	color: #228;
}
</style>
<script type="module" src="static/argon2.umd.min.js"></script>
<script src="./static/UserAuthentication.js"></script>
<script>
"use strict";
const registration_url = "registration/";
let password_is_visible = false;
const url_params = new URLSearchParams(location.search);
let url_params_invite;
if (url_params.get("invite")) {
	url_params_invite = url_params.get("invite");
	invite_information.style["display"] = "inherit";
	login_button.style["display"] = "none";
}

async function registerAction() {
	try {
		const new_account_username = account_username_input.value;
		let auth_user = new UserAuthentication(new_account_username, account_password_input.value);

		status_dialog_body.textContent = "Requesting new account parameters...";
		status_dialog.showModal();
		await auth_user.requestAccountParameters(true);

		status_dialog_body.textContent = "Calculating secure hash...";
		const password_hash_base64 = await auth_user.calculateHash();
		// console.log(`[newRegisterAction] password_hash_base64: ${password_hash_base64}`);
		// Send the new hash to the server

		status_dialog_body.textContent = "Sending account details to server...";
		let create_new_account_data = {
			intermediate_salt_base64: auth_user.parameters_json["intermediate_salt_base64"],
			username: new_account_username,
			password_hash_base64: password_hash_base64
		};
		if (url_params_invite) {
			create_new_account_data["invite"] = url_params_invite;
		}

		const create_new_account_response = await fetch("./registration/create_new_account", {
			method: "POST",
			body: JSON.stringify(create_new_account_data)
		});
		status_dialog.close();
		if (!(create_new_account_response && create_new_account_response.ok)) {
			const res_message = create_new_account_response.headers.get("message");
			throw new Error("Could not create new account: " + res_message ? res_message : create_new_account_response.statusText);
		}
		registered_as.textContent = new_account_username;
		registration_success_dialog.showModal();
		// localStorage.setItem("authorisation_token", authorisation_token);
		localStorage.setItem("account_username", new_account_username);
		localStorage.setItem("logged_in", "true");
		localStorage.setItem("name", new_account_username);
	}
	catch (error) {
		status_dialog.close();
		console.error(error.message);
		error_messages.innerText = error.message ? error.message : "An unknown error occured";
	}
}

async function loginAction() {
	try {
		const username_input = account_username_input.value;
		let auth_user = new UserAuthentication(username_input, account_password_input.value);
		status_dialog_body.textContent = "Requesting login parameters...";
		status_dialog.showModal();
		await auth_user.requestAccountParameters();
		status_dialog_body.textContent = "Calculating secure hash...";
		const password_hash_base64 = await auth_user.calculateHash();
		status_dialog_body.textContent = "Sending credentials to server...";
		const login_response = await fetch("./registration/login", {
			method: "POST",
			body: JSON.stringify({
				username: username_input,
				password_hash_base64: password_hash_base64,
				stay_logged_in: stay_logged_in_checkbox.checked
			})
		});
		status_dialog.close();
		if (!(login_response && login_response.ok)) {
			let header_error_message = login_response.headers.get("message");
			if (header_error_message == null)
				throw new Error(`ERROR ${login_response.status}\n${login_response.statusText}`);
			else
				throw new Error(header_error_message);
		}
		logged_in_as.textContent = username_input;
		login_success_dialog.showModal();
		localStorage.setItem("account_username", username_input);
		localStorage.setItem("logged_in", "true");
		localStorage.setItem("name", username_input);
	}
	catch (error) {
		status_dialog.close();
		console.error(error);
		console.error(error.message ? error.message : "An unknown error occured");
		error_messages.innerText = error.message ? error.message : "An unknown error occured";
	}
}

function togglePasswordVisibility() {
	if (password_is_visible) {
		account_password_input.type="password";
		toggle_password_visibility_button.value = "Show";
		password_is_visible=false;
	}
	else {
		account_password_input.type="text";
		toggle_password_visibility_button.value = "Hide";
		password_is_visible=true;
	}
}
</script>
</html>
