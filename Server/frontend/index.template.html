async function mountThreadListIfNotThere(data) {
	await customElements.whenDefined("thread-list"); // wait for component to be loaded and defined, since JS module deferred loading will process sooner than router resolution, or however the deer hits the fence
	// thread-list is custom element defined in board.js
	let element = view_container.querySelector("thread-list");
	if (!element) {
		element = document.createElement("thread-list");
		view_container.replaceChildren(element);
	}
	console.log(element);
	return element;
}

async function mountBoardListIfNotThere() {
	await customElements.whenDefined("board-list");
	let element = view_container.querySelector("board-list");
	if (!element) {
		element = document.createElement("board-list");
		view_container.replaceChildren(element);
	}
	console.log(element);
	return element;
}

async function getClientInfo() {
	try {
		const response = await fetch("api/user/client");
		console.log(response);
		if (response.ok) {
			await response.json().then(response_json => {
				console.log(response_json);
				if (!response_json["has_cookie"] && localStorage.getItem("logged_in") === "true") {
					displayClientAsLoggedOut();
				}
				// state.server_permissions = response_json["server_permissions"];
				// window.history.replaceState(state, null, ""); // Initial state
				manage_server_button.style["display"] = response_json["server_permissions"]["manage_permissions"] === true ? "inherit" : "none";
				// console.log(state);
			});
		}
		else {
			let error_message = response.headers.get("message");
			error_message ??= "An unknown error occured when attempting to fetch client.";
			throw error_message;
		}
	}
	catch (error) {
		console.error(error);
		error_message.textContent = error;
		error_dialog.showModal();
	}
}
