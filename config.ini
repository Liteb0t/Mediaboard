# Server config file. Read at runtime when the server starts. For front-end configuration, see 'tokens.m4'.

# Directory where user-submitted media is stored. Must end with a '/'. A relative path can be used.
# This directory should contain a folder named 'thumbnails'.
media_path = media/

# Serves http://localhost:8300 by default.
port = 8300

# Number of async threads.
threads = 1

# Name of the postgresql database. Default is "fuze_mediaboard".
database = fuze_mediaboard
