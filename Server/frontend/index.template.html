<!DOCTYPE html>
<html lang="en">
	<head>
		<title>CONFIG_site_name</title>
		<meta name="description" content="Fuze Mediaboard is an imageboard engine with advanced permissions.">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta charset="utf-8">
		<link rel="icon" type="image/x-icon" href="CONFIG_favicon_url">
		<link rel="stylesheet" href="FILE_"static/styles.css"">
	</head>
	<body>
#define SERVER_LEVEL 1
#include "include/navbar.html"
		<main id="view_container">
			<!--<h3 id="location_indicator">List of boards</h3>
			<div id="view_container"></div>
			<p><a href="https://fuze.page/software/mediaboard">Fuze Mediaboard</a> CONFIG_server_version</p>-->
		</main>
		<dialog id="loading_dialog"><p>Loading. Please wait...</p></dialog>
		<dialog id="error_dialog" closedby="any">
			<h2>Error</h2>
			<p id="error_message">Something happened.</p>
			<div class="ToolBar"><button onclick="error_dialog.close()">&#x1F5D9; Close</button></div>
		</dialog>
		<noscript>
			<dialog open style="margin-top: 20vh"><h2>Error</h2><p>This page requires <b>Javascript</b> to function. Enable Javascript in browser settings.</p></dialog>
		</noscript>
	</body>
<template id="board-list-template" class="TestClassForTemplate">
#include "include/board_list.html"
</template>
<template id="thread-list-template">
#include "include/board.html"
</template>
<template id="file-upload-template">
#include "include/file_upload.html"
</template>
<template id="media-manager-template">
#include "include/media_manager.html"
</template>
<style>
main {
	flex-grow: 1;
	>thread-list, media-manager {
		display: flex;
		flex-flow: column;
		height: 100%;
	}
}
</style>
<script src="static/navigo.min.js"></script>
<script type="module" src="modules/board.js"></script>
<script type="module" src="modules/media_manager.js"></script>
<script type="module" src="modules/RoomListElement.js"></script>
<script type="module">
import { global_styles } from "./modules/styles.js";
import { session } from "./modules/session.js";

#include "include/board_list.js"

let abort_controller;

const router = new Navigo('/', { hash: true });
router.on(async() => {
	console.log("ROOT opened");
	try {
		loading_dialog.showModal();
		const url = new URL(window.location.href);
		url.search = "";
		history.replaceState(null, null, url);
		let board_list = await mountElementIfNotThere("board-list");
		await board_list.render();
		loading_dialog.close();
	}
	catch (error) {
		console.error(error);
		error_message.textContent = error;
		error_dialog.showModal();
	}
});
router.on("/board/:board_slug", async({data}) => {
	try {
		console.log(data);
		let thread_list = await mountElementIfNotThere("thread-list");
		await thread_list.render(data.board_slug);
	}
	catch (error) {
		console.error(error);
		error_message.textContent = error;
		error_dialog.showModal();
	}
});
router.on("/board/:board_slug/thread/:thread_id", async({data}) => {
	try {
		console.log(data);
		let thread_list = await mountElementIfNotThere("thread-list");
		await thread_list.render(data.board_slug, Number(data.thread_id));
	}
	catch (error) {
		console.error(error);
		error_message.textContent = error;
		error_dialog.showModal();
	}
});
router.on("/media", async({data}) => {
	try {
		console.log(data);
		let media_manager_element = await mountElementIfNotThere("media-manager");
		await media_manager_element.render(true); // true means fetch boards as well
	}
	catch (error) {
		console.error(error);
		error_message.textContent = error;
		error_dialog.showModal();
	}
});
router.on("/rooms", async({data}) => {
	try {
		console.log(data);
		abort_controller?.abort();
		abort_controller = new AbortController();
		if (!document.getElementById("room-list-template"))
			await getRoomList(abort_controller.signal);
		let room_list_element = await mountElementIfNotThere("room-list");
		await room_list_element.render(true); // true means fetch boards as well
	}
	catch (error) {
		console.error(error);
		error_message.textContent = error;
		error_dialog.showModal();
	}
});
window.localDate = new Date();
window.timezone_offset_seconds = localDate.getTimezoneOffset() * 60;
window.flex_separator = document.createElement("div");
window.flex_separator.classList.add("FlexSeparator");

async function mountElementIfNotThere(element_name) {
	await customElements.whenDefined(element_name); // wait for component to be loaded and defined, since JS module deferred loading will process sooner than router resolution, or however the deer hits the fence
	// thread-list is custom element defined in board.js
	let element = view_container.querySelector(element_name);
	if (!element) {
		element = document.createElement(element_name);
		view_container.replaceChildren(element);
	}
	console.log(element);
	return element;
}

async function getRoomList(signal) {
	const response = await fetch("./static/room-list.html", {signal: signal});
	// if (signal.aborted)
	// 	return;
	if (!response.ok) {
		throw new Error(`Response status: ${response.status}`);
	}
	const result = await response.text();
	const template = document.createElement("template");
	template.id = "room-list-template";
	template.innerHTML = result;
	document.body.appendChild(template);
}

// For embedding Mediaboard within a webpage using an <iframe>.
// Hides everything except messages.
const url_params = new URLSearchParams(location.search);
window.url_params_display_as_embed = null;
if (url_params.get("display") === "embed") {
	header_bar.style["display"] = "none";
	// location_indicator.style["display"] = "none";
	window.url_params_display_as_embed = true;
}
else window.url_params_display_as_embed = false;

document.addEventListener("logout", () => {
	session.refresh();
	router.resolve();
})

router.resolve();
</script>
</html>
