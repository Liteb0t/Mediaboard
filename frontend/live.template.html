<!DOCTYPE html>
<html lang="en">
<head>
    <title>CONFIG_site_name</title>
    <meta name="description" content="Fuze Mediaboard is an imageboard engine with advanced permissions.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8">
    <link rel="icon" type="image/x-icon" href="CONFIG_favicon_url">
    <link rel="stylesheet" href=FILE_"static/styles.css">
</head>
<body>
	<main>
#include "navbar.html"
		<h3 id="location_indicator"></h3>
		<button id="create_room_button">Create room</button>
		<button id="show_rooms_button">Show rooms</button><br>
		<div id="room_list_container"></div>
#include "room.html"
	</main>
	<noscript>
		<dialog open style="margin-top: 20vh"><h2>Error</h2><p>This page requires <b>Javascript</b> to function. Enable Javascript in browser settings.</p></dialog>
	</noscript>
	<dialog id="error_dialog" closedby="any">
		<h2>Error</h2>
		<p id="error_message">Something happened.</p>
		<div class="ToolBar"><button onclick="error_dialog.close()">&#x1F5D9; Close</button></div>
	</dialog>
</body>
<style>
.LiveVideoContainer &>video {
	border: 2px solid #000;
	margin: 4px;
}
.Connected {
	color: var(--information-text);
}
</style>
<script>
"use strict";
let state = {
	selected_board: {
		slug: null,
		permissions: {}
	},
	selected_room: {
		id: null
	}
};
let selected_room_id = -1;
const websocket_url = (window.location.protocol === "http:" ? "ws://" : "wss://") + window.location.host + window.location.pathname;
const url_params = new URLSearchParams(location.search);
if (url_params.get("board")) {
	state.selected_board.slug =  url_params.get("board");
	navlink_threads.href = `board.html?board=${state.selected_board.slug}`;
	navlink_threads.style["display"] = "inherit";
}

let room_connection = null;
function connectClientToRoom(room_id) {
	room_connection = new RoomConnection(room_id);
}
// let pc;
// let listening_connections = [];

create_room_button.onclick = () => { createRoom(); }
async function createRoom() {
	console.log("sending create room request...");
	const fetch_response = await fetch(`api/board/${state.selected_board.slug}/room`, {method: "POST"});
	if (!fetch_response.ok) {
		let error_message = response.headers.get("message");
		error_message ??= "An unknown error occured when attempting to create room.";
		throw error_message;
	}
	return fetch_response;
}
show_rooms_button.onclick = () => { getAllRooms(); }
async function getAllRooms() {
	let response = await fetch(`./api/board/${state.selected_board.slug}/rooms`);
	console.log(response);
	if (response.ok) {
		await response.json().then(response_obj => {
			console.log(response_obj);
			showAllRooms(response_obj);
		});
	}
	else {
		let error_message = response.headers.get("message");
		error_message ??= "An unknown error occured when attempting to fetch rooms.";
		throw error_message;
	}
}

function showAllRooms(message_json) {
	location_indicator.textContent = "Rooms in board " + state.selected_board.slug;
	//threads_button.disabled = true;

	const fragment = new DocumentFragment();
	for (let room of message_json.rooms) {
		// console.log(thread.id);
		// console.log(thread.post_zero);
			let room_element = document.createElement("div");
			room_element.classList.add("Room");
			room_element.id = `room_${room.id}`;
			// Toolbar at the bottom of each thread
			const id_indicator = document.createElement("span");
			id_indicator.textContent = room.id;
			const connect_button = document.createElement("button");
			connect_button.textContent = "Connect";
			connect_button.onclick = () => {
				connectClientToRoom(room.id);
			}
			room_element.append(id_indicator, connect_button);

			fragment.appendChild(room_element);
	}
	if (fragment.children.length === 0)
		room_list_container.replaceChildren(document.createTextNode("None."));
	else
		room_list_container.replaceChildren(fragment);
}

async function getClientInfo() {
	try {
		const response = await fetch("api/user/client");
		console.log(response);
		if (response.ok) {
			await response.json().then(response_json => {
				console.log(response_json);
				if (!response_json["has_cookie"] && localStorage.getItem("logged_in") === "true") {
					displayClientAsLoggedOut();
				}
				state.server_permissions = response_json["server_permissions"];
				window.history.replaceState(state, null, ""); // Initial state
				// manage_server_button.style["display"] = response_json["server_permissions"]["manage_permissions"] === true ? "inherit" : "none";
			});
		}
		else {
			let error_message = response.headers.get("message");
			error_message ??= "An unknown error occured when attempting to fetch client.";
			throw error_message;
		}
	}
	catch (error) {
		console.error(error);
		error_message.textContent = error;
		error_dialog.showModal();
	}
}

async function getBoardInfo() {
	try {
		const board_slug_from_url = url_params.get("board");
		if (board_slug_from_url === null)
			throw "URL parameter 'board' is required (example: ?board=qa).";
		state.selected_board.slug = board_slug_from_url;
		const response = await fetch(`api/board/${state.selected_board.slug}`);
		console.log(response);
		if (response.ok) {
			await response.json().then(response_json => {
				console.log(response_json);
				state.selected_board.permissions = response_json["client_permissions"];
				window.history.replaceState(state, null, ""); // Initial state
			});
		}
		else {
			let error_message = response.headers.get("message");
			error_message ??= "An unknown error occured when attempting to fetch board info.";
			throw error_message;
		}
	}
	catch (error) {
		console.error(error);
		error_message.textContent = error;
		error_dialog.showModal();
	}
}
getClientInfo(); // runs asynchronously
getBoardInfo();
</script>
</body>
</html>
