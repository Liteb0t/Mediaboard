	<script>
		"use strict";
		const root_url = "_ROOT_URL"; // set these URLS according to the server configuration
		const api_url = "api/"; // these will be managed by a central config file eventually
		const media_url = "media/"; // so you wont need to reconfigure these every update
		const thumbnail_url = "media/thumbnails/";
		const file_size_limit = _FILE_SIZE_LIMIT_MB*1024*1024;
		// 66 unreserved URI chars: https://www.rfc-editor.org/rfc/rfc3986#page-13
		const valid_uri_chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
		const media_uuid_len = 36;
		const localDate = new Date();
		const timezone_offset_seconds = localDate.getTimezoneOffset() * 60;
		const flex_separator = document.createElement("div");
		flex_separator.classList.add("FlexSeparator");
		let state = {selected_thread_id: null};
		let websocket;
		let websocket_connected;
		console.log(websocket);
		loading_dialog.show();

		if (window.location.pathname.startsWith(root_url + "thread/")) {
			let second_slash_index = window.location.pathname.indexOf("/", root_url.length + 7);
			if (second_slash_index > 0) {
				let thread_number = parseInt(window.location.pathname.substring(root_url.length + 7, second_slash_index));
				if (!isNaN(thread_number)) {
					state.selected_thread_id = thread_number;
				}
				else {
					alert("Error: thread_number is NaN");
				}
			}
			else {
				alert("Error: missing trailing / in URL for parsing thread number");
			}
		}
		else {
			state.selected_thread_id = -1;
		}

		window.history.replaceState(state, null, ""); // Initial state

		window.onpopstate = function(event) {
			if (event.state) {
				state = event.state;
			}
			refresh_send();
		}

		class Format {
			static IMAGE = 0;
			static AUDIO = 1;
			static OTHER = -1;
			static image_formats = ["gif", "jpg", "jpeg", "jxl", "png", "webp"];
			static audio_formats = ["flac", "mp3", "ogg", "ogx", "opus", "wav"];
			static fromFileName(file_name) {
				let dot_index = file_name.indexOf('.');
				if (dot_index !== -1) {
					let file_extension = file_name.substring(dot_index+1);
					if (Format.image_formats.indexOf(file_extension) !== -1) {
						return Format.IMAGE;
					}
					else if (Format.audio_formats.indexOf(file_extension) !== -1) {
						return Format.AUDIO;
					}
					else {
						return Format.OTHER;
					}
				}
				else {
					return Format.OTHER;
				}
			}
		}

		// Used to verify the author on deleting a message.
		let user_key = localStorage.getItem("key");
		if (user_key === null || user_key.length !== 8) {
			user_key = '';
			for (let i = 0; i < 8; i++) {
				user_key += valid_uri_chars.charAt(Math.floor(Math.random() * valid_uri_chars.length));
			}
			localStorage.setItem("key", user_key);
		}
		// The value in the name field is set to the name used in the most recent post, if any.
		name_field.value = localStorage.getItem("name");

		async function postAction() {
			let name_length_bytes = (new TextEncoder().encode(name_field.value)).length;
			let content_length_bytes = (new TextEncoder().encode(content_field.innerText)).length;
			if (content_field.textContent.length === 0) {
				alert("Error: Cannot create post with empty content");
			}
			else if (name_length_bytes > 73) {
				alert("Error: Name too long.\nLimit: 73\nThis name: " + name_length_bytes);
			}
			else if (content_length_bytes > 5000) {
				alert("Error: Content too long.\nLimit: 5000\nMessage content: " + content_length_bytes);
			}
			else {
				let response;
				if (state.selected_thread_id === -1) {
					response = await postThread();
				}
				else {
					response = await postMessage();
				}
				if (response.ok) {
					content_field.textContent = "";
					file_upload.value = "";
					file_post_list.textContent = "";
					if (state.selected_thread_id === -1) {
						let new_thread_id = response.headers.get("new-thread-id");
						thread_posted_dialog_open_thread_button.onclick = () => { openThread(new_thread_id); thread_posted_dialog.close(); }
						thread_posted_dialog.showModal();
					}
				}
				else {
					console.log(response);
					alert("Error when attempting to post\nStatus: " + response.status + "\nstatusText: " + response.statusText);
				}
				localStorage.setItem("name", name_field.value);
			}
		}

		function removeFileFromList(file_container) {
			file_post_list.removeChild(file_container);
			file_upload.disabled = false;
		}

		function openCatalog() {
			state.selected_thread_id = -1;
			history.pushState(state, "", root_url);
			// location_indicator.textContent = "Catalog";
			refresh_send();
		}

		function showThreads(message_json) {
			location_indicator.textContent = "Catalog";
			catalog_button.disabled = true;
			reply_heading_text.textContent = "Create a thread";
			const fragment = new DocumentFragment();
			for (let thread of message_json.threads) {
				// console.log(thread.id);
				// console.log(thread.post_zero);
				let post_zero_element = createPost(thread.post_zero);
				// console.log(post_zero_element);
				let thread_element = document.createElement("div");
				thread_element.classList.add("Thread");
				thread_element.appendChild(post_zero_element);

				// Toolbar at the bottom of each thread
				let thread_toolbar = document.createElement("div");
				thread_toolbar.classList.add("ToolBar", "WithBorders");

				const reply_count_container = document.createElement("div");
				const reply_count = document.createElement("span");
				reply_count.textContent = "Replies: " + (thread.number_of_posts - 1);
				reply_count_container.appendChild(reply_count);

				let open_thread_button = document.createElement("button");
				open_thread_button.classList.add("ToolBarButton");
				open_thread_button.textContent = "\u21E8 Open thread";
				open_thread_button.onclick = (event) => {
					openThread(thread.id);
				}

				thread_toolbar.append(reply_count_container, flex_separator.cloneNode(), open_thread_button);
				// thread_toolbar.appendChild(open_thread_button);
				thread_element.appendChild(thread_toolbar);
				fragment.appendChild(thread_element);
			}
			post_container.replaceChildren(fragment);
		}
		function showPosts(message_json) {
			location_indicator.textContent = "Posts";
			catalog_button.disabled = false;
			reply_heading_text.textContent = "Leave a reply";
			const fragment = new DocumentFragment();
			for (let post of message_json.posts) {
				fragment.appendChild(createPost(post));
			}
			post_container.replaceChildren(fragment);
		}
		async function getThreads() {
			let response = await fetch(root_url + api_url + "get_threads/");
			if (response.ok) {
				await response.json().then(response_obj => {
					console.log(response_obj);
					showThreads(response_obj);
				});
			}
			else {
				alert("Server error from getThreads(). the developer must suck lmao");
			}
		}
		function openThread(thread_id) {
			state.selected_thread_id = thread_id;
			history.pushState(state, "", root_url + "thread/" + state.selected_thread_id + "/");
			getThreadPosts();
		}
		async function getThreadPosts() {
			let response = await fetch(root_url + api_url + "threads/" + state.selected_thread_id + "/get_posts/", {
				headers: {
					"key": user_key
				}
			});
			if (response.ok) {
				await response.json().then(response_obj => {
					console.log(response_obj);
					showPosts(response_obj);
					console.log("1");
				});
				console.log("2");

				websocket = connectToServer();
			}
			else {
				alert("Server error from getThreadPosts(). the developer must suck lmao");
			}
		}

		function addFileToList(filename) {
			let file_container = document.createElement("div");
			let file_thumbnail = document.createElement("img");
			file_thumbnail.setAttribute("src", "placeholder.png");
			file_thumbnail.setAttribute("width", "100px");
			file_thumbnail.setAttribute("height", "100px");
			const file_information_container = document.createElement("div");
			let file_title = document.createElement("span");
			// file_title.classList.add("FileTitle");
			file_title.textContent = filename;
			let file_delete_button = document.createElement("button");
			file_delete_button.textContent = "\u{1F5D1} Delete"; // 1F5D1 = смітник
			let progress_element = document.createElement("progress");
			progress_element.value = 0;
			file_information_container.append(file_title, document.createElement("br"), progress_element, document.createElement("br"), file_delete_button);
			file_container.append(file_thumbnail, file_information_container);
			file_post_list.appendChild(file_container);
			file_delete_button.onclick = (event) => {
				// Add delete to server later
				// file_post_list.removeChild(document.getElementById("file_" + server_filename));
				removeFileFromList(file_container);
			}
			return file_container;
		}

		content_field.oninput = () => {
			// Remove leftover <br> tag so the placeholder appears again
			if (content_field.children.length === 1 && content_field.children[0].tagName === "BR") {
				content_field.removeChild(content_field.children[0]);
			}
		}

		// "Scroll-lock" feature - when a user is scrolled to the bottom of the messages list, adding content in the reply container will push the messages up so that the latest messages are not obstructed.
		let lock_scroll_to_bottom = false;
		const reply_container_resize_observer = new ResizeObserver(() => {
			if (lock_scroll_to_bottom) {
				bottom_marker.scrollIntoView(false);
			}
		});
		reply_container_resize_observer.observe(reply_container);
		const options = {
			// root: document.body,
			rootMargin: "5px",
			scrollMargin: "5px",
			threshold: 0.5,
		};
		const callback = (entries, observer) => {
			for (let entry of entries) {
				if (entry.target === bottom_marker) {
					lock_scroll_to_bottom = entry.isIntersecting;
				}
			}

			console.log(entries);
		}
		const observer = new IntersectionObserver(callback, options);
		observer.observe(bottom_marker);

		function sanitiseFileName(file_name) {
			let sanitised_file_name = "";
			for (let i = 0; i < file_name.length; i++) {
				if (valid_uri_chars.indexOf(file_name[i]) === -1) {
					sanitised_file_name += "_";
				}
				else {
					sanitised_file_name += file_name[i];
				}
			}
			return sanitised_file_name;
		}
		function decode_utf8(s) {
			return decodeURIComponent(escape(s));
		}

		function uploadFile(file_object) {
			let formdata = new FormData();
			formdata.append("File_1", file_object);
			// let file_name = sanitiseFileName(file_object.name);
			// console.log("file_name: " + file_name);
			let file_element = addFileToList(file_object.name);
			let file_progress_element = file_element.querySelector("progress");
			let file_img_element = file_element.querySelector("img");
			let request = new XMLHttpRequest();
			file_progress_element.max = file_object.size;
			console.log(file_object);
			request.upload.addEventListener("progress", (event) => {
				file_progress_element.value = event.loaded;
			});
			request.responseType = "text";
			request.open("POST", root_url + api_url + "upload/");
			request.timeout = 10000;
			request.send(formdata);
			request.onload = () => {
				if (request.readyState === request.DONE) {
			        if (request.status === 202) {
						console.log("Received response");
						const headers = request.getAllResponseHeaders();
						console.log(headers);
						const server_filename = request.getResponseHeader("File-Name");
						console.log("server_filename: " + server_filename);
						let decoded_filename = decode_utf8(server_filename);
						console.log("server_filename decoded: " + decoded_filename);
						// const utf8array = new TextEncoder().encode(server_filename);
						// var newdecoded = new TextDecoder().decode(utf8array);
						// console.log("server_filename dec new: " + newdecoded);
						file_element.setAttribute("id", "file_" + decoded_filename);
						if (Format.fromFileName(server_filename) === Format.IMAGE) {
							file_img_element.setAttribute("src", root_url + media_url + decoded_filename);
						}
						const upload_complete_indicator = document.createElement("span");
						upload_complete_indicator.classList.add("UploadCompleteIndicator");
						upload_complete_indicator.textContent = "Upload complete";
						file_element.replaceChild(upload_complete_indicator, file_progress_element);
			        }
			    }
			};
		}
		file_upload.onchange = (event) => {
			console.log("file changed.");
			if (file_upload.files.length + file_post_list.childNodes.length > 4) {
				alert("Error: 4 file limit reached");
				file_upload.value = "";
			}
			else {
				for (let chosen_file of file_upload.files) {
					if (chosen_file.size > file_size_limit) {
						alert("Error: file size exceeds _FILE_SIZE_LIMIT_MB megabyte limit\n" +
							"File: " + chosen_file.name);
						file_upload.value = "";
					}
					else {
						const file_name_size = (new TextEncoder().encode(chosen_file.name)).length;
						if (file_name_size > 255) {
							alert("Error: file name too long. Limit: 255 bytes\n" + 
								"Size of this file name: " + file_name_size + "\n" +
								"File: " + chosen_file.name);
						}
						else {
							console.log("uploading...");
							uploadFile(chosen_file);
						}
					}
				}
			}
		}

		function createPost(data) {
			console.log(data);
			let post_box_element = document.createElement("article");
			post_box_element.classList.add("Post");
	
			let post_header_element = document.createElement("div");
			// post_header_element.classList.add("PostHeader");
			post_header_element.classList.add("ToolBar");
	
			let post_name_element = document.createElement("b");
			post_name_element.classList.add("Username");
			post_name_element.textContent = data.name;

			let post_timestamp_element = document.createElement("time");
			let post_date = new Date(data.upload_timestamp * 1000 - timezone_offset_seconds * 1000).toISOString();;
			post_date = post_date.substring(0, 10) + " " + post_date.substring(11, 19);
			post_timestamp_element.textContent = post_date;
			post_timestamp_element.classList.add("Timestamp");

			let post_id_element = document.createElement("span");
			post_id_element.classList.add("ID");
			let post_id;
			if (state.selected_thread_id > -1) {
				post_id = `#${data.thread_id}/${data.id_in_thread}`;
			}
			else {
				post_id = "#" + data.thread_id;
			}
			post_id_element.textContent = post_id;

			post_header_element.append(post_name_element /*, flex_separator.cloneNode()*/);
			const right_aligned_toolbar_group = document.createElement("div");
			right_aligned_toolbar_group.classList.add("ToolBar", "RightAligned");

			// Delete button
			if (data.is_author) {
				let delete_button_element = document.createElement("button");
				delete_button_element.textContent = "\u{1F5D1} Delete";
				delete_button_element.onclick = async() => { 
					let server_response = await deleteMessage(data.thread_id, data.id_in_thread);
					console.log(server_response);
					if (server_response.ok) {
						post_box_element.classList.add("Deleted");
						delete_button_element.disabled = true;
					}
					else {
						alert(`Error: Could not delete message\nResponse: ${server_response.status} ${server_response.statusText}`);
					}
				}
				// post_header_element.appendChild(delete_button_element);
				right_aligned_toolbar_group.appendChild(delete_button_element);
			}
			// Reply button
			if (state.selected_thread_id > -1) { // Reply button will not appear on catalog (thread list)
				let reply_button_element = document.createElement("button");
				reply_button_element.style["margin-left"] = "0.5em";
				reply_button_element.textContent = "\u{2BA9} Reply";
				reply_button_element.onclick = () => {
					content_field.innerText += post_id + " ";
				}
				right_aligned_toolbar_group.appendChild(reply_button_element);
			}
			right_aligned_toolbar_group.append(post_id_element, post_timestamp_element);
			post_header_element.append(right_aligned_toolbar_group);

			let post_content_element = document.createElement("div");
			post_content_element.classList.add("Content");

			// Highlight reply links by wrapping them in a <span> element
			const message_content_split = data.content.split(/#\d*\/(\d+)\b/g);
			for (let i = 0; i < message_content_split.length; i+=2) {
				post_content_element.appendChild(document.createTextNode(message_content_split[i]));
				if (i+1 !== message_content_split.length) {
					let reply_link = document.createElement("span");
					reply_link.classList.add("PostLink");
					reply_link.textContent = `#${data.thread_id}/${message_content_split[i+1]}`;
					post_content_element.appendChild(reply_link);
				}
			}
	
			let post_files_element = document.createElement("div");
			post_files_element.classList.add("Files");
			for (const filename of data.files) {
				let figure_element = document.createElement("figure");
				figure_element.classList.add("EmbedFigure");
				let filename_extension_i = filename.lastIndexOf(".");
				let file_format = Format.fromFileName(filename); // Format enum
				if (file_format === Format.IMAGE) {
					let thumbnail_element = document.createElement("img");
					thumbnail_element.classList.add("EmbedThumbnail");
					let thumbnail_filename = "THUMBNAIL_" + filename + ".jxl";
					thumbnail_element.setAttribute("src", root_url + thumbnail_url + thumbnail_filename.replace(" ", "%20"));
					let image_opened = false;
					let img_element = document.createElement("img");
					img_element.classList.add("EmbedImage");
					thumbnail_element.onclick = (event) => {
						if (!image_opened) {
							image_opened = true;
							img_element.onload = (event) => {
								img_element.style["display"] = "inherit";
								thumbnail_element.style["display"] = "none";
							}
							img_element.setAttribute("src", root_url + media_url + filename.replace(" ", "%20"));
						}
						else {
							thumbnail_element.style["display"] = "none";
							img_element.style["display"] = "inherit";
						}
					}
					img_element.style["display"] = "none";
					img_element.onclick = (event) => {
						thumbnail_element.style["display"] = "inherit";
						img_element.style["display"] = "none";
					}
					figure_element.appendChild(img_element);
					thumbnail_element.setAttribute("loading", "lazy");
					thumbnail_element.setAttribute("width", "150px");
					thumbnail_element.setAttribute("height", "150px");
					figure_element.appendChild(thumbnail_element);
				}
				else if (file_format === Format.AUDIO) {
					let audio_element = document.createElement("audio");
					audio_element.controls = true;
					audio_element.setAttribute("controlslist", "nofullscreen nodownload");
					audio_element.setAttribute("src", root_url + media_url + filename.replace(" ", "%20"));
					figure_element.appendChild(audio_element);
				}
				// else {
					// thumbnail_element.setAttribute("src", root_url + "placeholder.png");
				// }
				let pretty_filename;
				if (filename_extension_i == -1) {
					pretty_filename = filename.slice(0, filename.length - media_uuid_len);
				}
				else {
					pretty_filename = filename.slice(0, filename_extension_i - media_uuid_len) + filename.slice(filename_extension_i, filename.length);
				}
				let figcaption_element = document.createElement("figcaption");
				let figcaption_element_a = document.createElement("a");
				figcaption_element_a.setAttribute("href", root_url + media_url + filename.replace(" ", "%20"));
				figcaption_element_a.textContent = pretty_filename;
				figcaption_element.appendChild(figcaption_element_a);
				figure_element.appendChild(figcaption_element);
				post_files_element.appendChild(figure_element);
	
			}
	
			post_box_element.appendChild(post_header_element);
			post_box_element.appendChild(post_content_element);
			post_box_element.appendChild(post_files_element);
			// post_container_element.appendChild(post_box_element);
			return post_box_element;
		}
	
		function refresh_send() {
			if (typeof websocket !== "undefined") {
				websocket.close();
			}
			if (state.selected_thread_id === -1) {
				getThreads();
			}
			else {
				getThreadPosts();
			}
		}

		function connectToServer() {
			// change this to your server URL where Fuze Mediaboard serves websockets
			// this will be done through a central config file later
			let sock = new WebSocket("_WEBSOCKET_URL");	
			sock.onopen = (event) => {
				// connection_status.textContent = "Connected 🙂";
				websocket_connected = true;
				if (state.selected_thread_id > -1) {
					sock.send(JSON.stringify({
						"type": "listen_to_thread",
						"thread_id": state.selected_thread_id
					}));
				}
			}
	
			sock.onmessage = (event) => {
				console.log("Message received: " + event.data);
				let message_json = JSON.parse(event.data);
				if (message_json.type === "post") {
					// auto-scroll to new message if window was scrolled near the bottom already
					let do_scroll = window.scrollY >= window.scrollMaxY - 10;

					post_container.appendChild(createPost(JSON.parse(event.data)));

					if (do_scroll) {
						window.scrollTo(0, post_container.scrollHeight);
					}
				}
				else {
					console.error("message_json type " + message_json.type + " not recognised.");
				}
			}
	
			sock.onerror = (event) => {
				// connection_status.textContent = "Errored 😤"
			}
	
			sock.onclose = (event) => {
				// connection_status.textContent = "Closed 😔"
				// connection_status.textContent = "Closed \u{1F634}"
				websocket_connected = false;
			}
			return sock
		}

		async function postMessage() {
			console.log("posting message...");
			let files = [];
			for (let file of file_post_list.children) {
				files.push(file.id.slice(5, file.id.length));
			}
			const data = {
				post: {
					name: name_field.value,
					content: content_field.innerText,
					files: files,
					thread_id: state.selected_thread_id
					,key: user_key
				}
			};
			console.log(data);
			const fetch_response = await fetch(root_url + api_url + "create_message/", {
				method: "POST",
				body: JSON.stringify(data)
			});
			return fetch_response;
		}

		async function deleteMessage(thread_id, message_id) {
			console.log("deleting message...");
			const data = {
				key: user_key
				,thread_id: thread_id
				,id_in_thread: message_id
			};
			const fetch_response = await fetch(root_url + api_url + "delete_message/" + `${thread_id}/${message_id}/`, {
				method: "DELETE"
				// ,headers: {
					// "auth-scheme": "token",
				// 	"key": user_key
				// }
				,body: JSON.stringify(data)
			});
			return fetch_response;
		}
	
		async function postThread() {
			console.log("posting thread...");
			let files = [];
			for (let file of file_post_list.children) {
				files.push(file.id.slice(5, file.id.length));
			}
			const data = {
				type: "create_thread",
				thread: {
					post_zero: {
						name: name_field.value,
						content: content_field.innerText,
						files: files
						,key: user_key
					}
					// ,key: user_key
				}
			};
			console.log(data);
			const fetch_response = await fetch(root_url + api_url + "create_thread/", {
				method: "POST",
				body: JSON.stringify(data)
			});
			return fetch_response;
		}
	
		refresh_send();
		loading_dialog.close();
		// websocket = connectToServer();
	</script>
