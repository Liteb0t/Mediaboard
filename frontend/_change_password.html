<!DOCTYPE html>
<html lang="en">
	<head>
		<!--
			include(`tokens.m4')
		-->
		<title>Change password - _SITE_NAME</title>
		<meta name="description" content="Fuze Mediaboard is a fast, modern messageboard.">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta charset="utf-8">
		<base href="_ROOT_URL">
		<link rel="icon" type="image/x-icon" href="_FAVICON_URL">
		<link rel="stylesheet" href="static/styles.css">
	</head>
	<body>
		<!--Navbar can go here-->
		<main>
			<h1>Change password - _SITE_NAME</h1>
			<h3>Editing account: <span id="account_username_element"></span></h3>
			<form action="" method="POST" autocomplete="account">
				<div class="FormGrid">
					<label for="old_password_input">Old password</label>
					<input id="old_password_input" type="password" name="old_password" required>
					<input type="button" value="Show Password" id="toggle_old_password_visibility_button" class="RightAligned" onclick="toggleOldPasswordVisibility()">
					<label for="new_password_input">New password</label>
					<input id="new_password_input" type="password" name="new_password" required>
					<input type="button" value="Show Password" id="toggle_new_password_visibility_button" class="RightAligned" onclick="toggleNewPasswordVisibility()">
				</div>
				<!--JSON is used instead of standard HTTP so this is not used
				<input type="submit">-->
				<input type="button" value="Change password" id="change_password_button" class="RightAligned" onclick="changePasswordAction()">
				<a class="Button RightAligned" href="_ROOT_URL">Return</a>
			</form>
			<div id="error_messages"></div>
		</main>
		<dialog id="password_reset_success_dialog" closedby="any">
			<h2>Success</h2>
			<p>Changed password for <i id="changed_password_for">some dude idk</i></p>
			<div class="ToolBar"><a class="Button" href="_ROOT_URL">Proceed</a><button onclick="password_reset_success_dialog.close()">Close</button></div>
		</dialog>
	</body>
<script src="api.js"></script>
<script>
"use strict";
let old_password_is_visible = false;
let new_password_is_visible = false;
const account_username = localStorage.getItem("account_username");
account_username_element.textContent = account_username;
changed_password_for.textContent = account_username;

async function changePasswordAction() {
	const fetch_response = await sendPasswordResetFormData("login");
	console.log(fetch_response);
	if (fetch_response && fetch_response.ok) {
		password_reset_success_dialog.showModal();
	}
}
async function sendPasswordResetFormData() {
	error_messages.textContent = "";
	const data = {
		old_password: old_password_input.value,
		new_password: new_password_input.value
	};
	let fetch_response;
	try {
		if (old_password_input.value.length === 0)
			throw new Error("Old password cannot be empty");
		if (new_password_input.value.length === 0)
			throw new Error("New password cannot be empty");
		fetch_response = await API.sendRequest("POST", "change_password", null, data);
		if (!fetch_response.ok) {
			let header_error_message = fetch_response.headers.get("message");
			if (header_error_message == null) {
				throw new Error(`ERROR ${fetch_response.status}\n${fetch_response.statusText}`);
			}
			else {
				throw new Error(`ERROR ${fetch_response.status}\n${fetch_response.statusText}\n${header_error_message}`);
			}
		}
	}
	catch (error) {
		error_messages.innerText = error.message;
		console.error(error.message);
	}
	return fetch_response;
}
function toggleOldPasswordVisibility() {
	if (old_password_is_visible) {
		old_password_input.type="password";
		toggle_old_password_visibility_button.value = "Show password";
		old_password_is_visible=false;
	}
	else {
		old_password_input.type="text";
		toggle_old_password_visibility_button.value = "Hide password";
		old_password_is_visible=true;
	}
}
function toggleNewPasswordVisibility() {
	if (new_password_is_visible) {
		new_password_input.type="password";
		toggle_new_password_visibility_button.value = "Show password";
		new_password_is_visible=false;
	}
	else {
		new_password_input.type="text";
		toggle_new_password_visibility_button.value = "Hide password";
		new_password_is_visible=true;
	}
}
</script>
</html>
