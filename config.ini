# Server config file. It is read when the server starts. For front-end macros, see 'frontend/tokens.m4'.

# Directory where "media" folder will reside, into which user-submitted media is stored. A relative path can be used.
media_path = media

# Serves http://localhost:8300 by default. Change this if running multiple Mediaboard instances.
server_port = 8300

# Number of async threads. Values greater than 1 should be used for testing only.
threads = 1

# Format must be supported by ImageMagick.
# Please note that any change in this setting will not apply to existing thumbnails - those will have to be converted manually.
# Also it is required that the _THUMBNAIL_FILE_FORMAT setting in frontend/tokens.m4 matches this.
thumbnail_file_format = jpg

# Which database engine to use. sqlite stores all the data in one file, whilst postgres is more advanced.
# database_engine = sqlite
database_engine = postgresql

# Only used when database_engine = sqlite
# sqlite_database_path = database/sqlite_data.db

# Database connection target. Only used when database_engine = postgresql
# See: https://www.postgresql.org/docs/current/libpq-connect.html#LIBPQ-CONNSTRING
# postgresql_use_uri is experimental and not used in ECPG
postgresql_use_uri = false
# postgresql_uri = mediaboard_server@localhost:5432/fuze_mediaboard
postgresql_host = localhost
postgresql_port = 5432
postgresql_user = mediaboard_server
postgresql_database_name = fuze_mediaboard
